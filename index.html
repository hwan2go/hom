<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빵집 재고 관리</title>
<style>
  :root { --bg:#fff8f0; --card:#fff; --line:#e8d9c5; --brown:#7a4a21; --warn:#d9534f; --amber:#e8a317; --ok:#2e7d32; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic",sans-serif; background:var(--bg); color:#333; }
  header { background:var(--brown); color:#fff; padding:16px 24px; font-size:20px; font-weight:bold; }
  main { max-width:1100px; margin:20px auto; padding:0 16px; display:grid; gap:20px; grid-template-columns:2fr 1fr; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  section.wide { grid-column:1 / -1; }
  h2 { margin:0 0 12px; font-size:17px; color:var(--brown); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px; border-bottom:1px solid var(--line); text-align:left; }
  th { background:#faf0e2; }
  tr.low td { background:#fdecea; }
  tr.zero td { background:#f8d7d5; font-weight:bold; }
  input, select, button { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; }
  button { background:var(--brown); color:#fff; border:none; cursor:pointer; }
  button.small { background:#bbb; padding:3px 8px; font-size:12px; }
  button.small.confirm { background:var(--warn); }
  form { display:grid; gap:10px; }
  label { display:grid; gap:4px; font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:end; }
  .row label { flex:1; min-width:110px; }
  .alert { padding:8px 10px; border-radius:6px; margin-bottom:6px; font-size:14px; }
  .alert.zero { background:#f8d7d5; } .alert.low { background:#fdecea; }
  .alert.exp { background:#fff3cd; } .alert.info { background:#e8f5e9; }
  .empty { color:#888; font-size:14px; }
  .msg { font-size:13px; min-height:18px; color:var(--warn); }
  @media (max-width:800px){ main{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>🥐 빵집 재고 관리</header>
<main>

  <!-- 섹션 A. 재고목록 -->
  <section id="listSec">
    <h2>A. 재고목록</h2>
    <form id="addForm" class="row" style="margin-bottom:14px">
      <label>품목 이름<input id="aName" required placeholder="예: 밀가루"></label>
      <label>단위<input id="aUnit" required placeholder="kg, 개" size="6"></label>
      <label>최소 보유량<input id="aMin" type="number" min="0" step="any" required value="0"></label>
      <button>품목 추가</button>
    </form>
    <div id="listBox"></div>
  </section>

  <!-- 섹션 B. 입출고 입력 -->
  <section id="ioSec">
    <h2>B. 입출고 입력</h2>
    <form id="ioForm">
      <label>1. 품목 선택<select id="ioItem" required></select></label>
      <label>2. 입고 / 출고
        <select id="ioType"><option value="in">입고</option><option value="out">출고</option></select>
      </label>
      <label>3. 수량<input id="ioQty" type="number" min="0" step="any" required></label>
      <label id="expWrap">유통기한 (입고 시, 선택)<input id="ioExp" type="date"></label>
      <button>4. 저장</button>
      <div class="msg" id="ioMsg"></div>
    </form>
  </section>

  <!-- 섹션 C. 알림 -->
  <section id="alertSec" class="wide">
    <h2>C. 알림</h2>
    <div id="alertBox"></div>
  </section>

  <section class="wide">
    <h2>최근 입출고 기록</h2>
    <div id="logBox"></div>
  </section>
</main>

<script>
const KEY = "bakery-stock-v1";
const EXPIRE_DAYS = 3; // 유통기한 임박 기준(일)
let data = { items: [], logs: [] };
let pendingDel = null;
const LOW_QTY = 5; // 수량이 이 값 이하이면 알림에 표시
const isLow = i => i.qty <= Math.max(i.min, LOW_QTY);

try { data = JSON.parse(localStorage.getItem(KEY)) || data; } catch (e) {}
if (!Array.isArray(data.items) || !Array.isArray(data.logs)) data = { items: [], logs: [] };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { console.warn("저장 실패", e); } };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const daysLeft = exp => Math.round((new Date(exp+"T00:00:00") - new Date(today()+"T00:00:00")) / 86400000);

function render() {
  // A. 재고목록
  $("listBox").innerHTML = data.items.length ? `
    <table><tr><th>품목</th><th>현재 수량</th><th>유통기한</th><th>최소 보유량</th><th></th></tr>
    ${data.items.map(i => `<tr class="${i.qty<=0?'zero':isLow(i)?'low':''}">
      <td>${esc(i.name)}</td><td>${i.qty} ${esc(i.unit)}</td><td>${i.expiry||"-"}</td>
      <td>${i.min} ${esc(i.unit)}</td><td><button class="small${pendingDel===i.id?' confirm':''}" data-del="${i.id}">${pendingDel===i.id?'정말 삭제?':'삭제'}</button></td></tr>`).join("")}
    </table>` : `<div class="empty">아직 품목이 없습니다. 위에서 추가해 주세요.</div>`;

  // B. 품목 선택 목록
  const cur = $("ioItem").value;
  $("ioItem").innerHTML = data.items.map(i => `<option value="${i.id}">${esc(i.name)} (${i.qty}${esc(i.unit)})</option>`).join("");
  if (cur) $("ioItem").value = cur;

  // C. 알림
  const a = [];
  data.items.forEach(i => {
    if (i.qty <= 0) a.push(`<div class="alert zero">⛔ 품절: ${esc(i.name)}</div>`);
    else if (isLow(i)) a.push(`<div class="alert low">⚠️ 재고 부족: ${esc(i.name)} (${i.qty}${esc(i.unit)} 남음)</div>`);
    if (i.expiry && i.qty > 0) {
      const d = daysLeft(i.expiry);
      if (d < 0) a.push(`<div class="alert exp">⏰ 유통기한 지남: ${esc(i.name)} (${i.expiry})</div>`);
      else if (d <= EXPIRE_DAYS) a.push(`<div class="alert exp">⏰ 유통기한 임박: ${esc(i.name)} (${d}일 남음, ${i.expiry})</div>`);
    }
  });
  const t = data.logs.filter(l => l.date === today());
  const sum = type => { const m = {}; t.filter(l=>l.type===type).forEach(l => m[l.name+"|"+l.unit] = (m[l.name+"|"+l.unit]||0)+l.qty);
    return Object.entries(m).map(([k,v]) => k.split("|")[0]+" "+v+k.split("|")[1]).join(", ") || "없음"; };
  a.push(`<div class="alert info">📋 오늘 입출고 요약<br>입고: ${esc(sum("in"))}<br>출고: ${esc(sum("out"))}</div>`);
  $("alertBox").innerHTML = a.join("");

  // 기록
  $("logBox").innerHTML = data.logs.length ? `<table><tr><th>날짜</th><th>품목</th><th>구분</th><th>수량</th></tr>
    ${data.logs.slice(-15).reverse().map(l => `<tr><td>${l.date}</td><td>${esc(l.name)}</td><td>${l.type==="in"?"입고":"출고"}</td><td>${l.qty} ${esc(l.unit)}</td></tr>`).join("")}</table>`
    : `<div class="empty">기록이 없습니다.</div>`;
}

$("addForm").onsubmit = e => {
  e.preventDefault();
  data.items.push({ id: Date.now().toString(), name: $("aName").value.trim(), unit: $("aUnit").value.trim(),
    qty: 0, expiry: "", min: Number($("aMin").value) });
  save(); e.target.reset(); $("aMin").value = 0; render();
};

$("listBox").onclick = e => {
  const id = e.target.dataset.del; if (!id) return;
  if (pendingDel !== id) { pendingDel = id; render(); return; }  // 첫 클릭: 확인 단계
  data.items = data.items.filter(i => i.id !== id);
  pendingDel = null; save(); render();
};

$("ioType").onchange = () => { $("expWrap").style.display = $("ioType").value === "in" ? "" : "none"; };

$("ioForm").onsubmit = e => {
  e.preventDefault();
  const it = data.items.find(i => i.id === $("ioItem").value);
  const qty = Number($("ioQty").value), type = $("ioType").value;
  if (!it) { $("ioMsg").textContent = "먼저 품목을 추가해 주세요."; return; }
  if (!(qty > 0)) { $("ioMsg").textContent = "수량은 0보다 커야 합니다."; return; }
  if (type === "out" && qty > it.qty) { $("ioMsg").textContent = `재고(${it.qty}${it.unit})보다 많이 출고할 수 없습니다.`; return; }
  it.qty = Math.round((it.qty + (type === "in" ? qty : -qty)) * 1000) / 1000;
  if (type === "in" && $("ioExp").value) it.expiry = $("ioExp").value;
  data.logs.push({ date: today(), name: it.name, unit: it.unit, type, qty });
  save(); $("ioMsg").textContent = ""; $("ioQty").value = ""; $("ioExp").value = ""; render();
};

render();
</script>
</body>
</html>
